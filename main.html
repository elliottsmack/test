<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rick H. Jones — Original Oil Paintings</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Cormorant Garamond & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            alabaster: '#FCFAE3',
            linen: '#F6EDD1',
            sand: '#CDD4B2',
            espresso: '#3F403A',
            charcoal: '#55564F',
            taupe: '#66675D',
            terracotta: '#C8A47A',
            terracottaDark: '#A9855E',
            sage: '#879276',
            sageLight: '#E9ECCD',
            gold: '#C8A47A',
            goldLight: '#F6EDD1'
          },
          fontFamily: {
            serif: ['Cormorant Garamond', 'Georgia', 'serif'],
            sans: ['Plus Jakarta Sans', '-apple-system', 'BlinkMacSystemFont', 'sans-serif']
          },
          boxShadow: {
            gallery: '0 18px 40px -15px rgba(63, 64, 58, 0.12)',
            galleryHover: '0 28px 55px -12px rgba(63, 64, 58, 0.22)',
            frame: '0 12px 30px -8px rgba(63, 64, 58, 0.18), inset 0 1px 0 rgba(255,255,255,0.6)'
          }
        }
      }
    };
  </script>

  <style>
    :root {
      color-scheme: light;
      --palette-olive: #CDD4B2;
      --palette-sage: #E9ECCD;
      --palette-ivory: #FCFAE3;
      --palette-cream: #F6EDD1;
      --palette-tan: #C8A47A;
      --ink: #3F403A;
    }

    html { background: var(--palette-ivory); scroll-behavior: smooth; }
    body {
      background: var(--palette-ivory);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .canvas-surface {
      background-color: var(--palette-cream);
      background-image:
        repeating-linear-gradient(0deg, rgba(63,64,58,.018) 0, rgba(63,64,58,.018) 1px, transparent 1px, transparent 5px),
        repeating-linear-gradient(90deg, rgba(63,64,58,.014) 0, rgba(63,64,58,.014) 1px, transparent 1px, transparent 5px);
    }
    .gallery-wall-ambient { background: var(--palette-cream); }

    .view-enter { animation: viewFadeIn .32s ease-out both; }
    @keyframes viewFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .reveal-item {
      opacity: 0;
      transform: translateY(10px);
      transition: opacity .42s ease, transform .42s ease;
    }
    .reveal-item.is-visible { opacity: 1; transform: translateY(0); }

    .nav-underline { position: relative; }
    .nav-underline::after {
      content: '';
      position: absolute;
      left: 0; bottom: -4px;
      width: 100%; height: 1px;
      background: var(--palette-tan);
      transform: scaleX(0);
      transform-origin: right center;
      transition: transform .24s ease;
    }
    .nav-underline:hover::after, .nav-underline.active::after {
      transform: scaleX(1);
      transform-origin: left center;
    }

    button, a {
      transition-property: color, background-color, border-color, box-shadow, opacity, transform;
      transition-duration: .22s;
      transition-timing-function: ease;
    }
    button:focus-visible, a:focus-visible {
      outline: 2px solid var(--palette-tan);
      outline-offset: 3px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
      .reveal-item { opacity: 1; transform: none; }
    }
  </style>
</head>
<body class="bg-alabaster text-espresso font-sans antialiased min-h-screen flex flex-col selection:bg-terracotta/20 selection:text-espresso">

  <!-- Sticky Navigation Header -->
  <header id="main-header" class="sticky top-0 z-40 bg-alabaster/90 backdrop-blur-md border-b border-sand/80 transition-all duration-300">
    <div class="max-w-7xl mx-auto px-5 sm:px-10 h-20 sm:h-24 flex items-center justify-between">
      <!-- Brand Identity -->
      <button onclick="navigateTo('about')" class="flex items-center gap-3.5 text-left group focus:outline-none">
        <span class="w-11 h-11 rounded-full bg-sageLight text-espresso font-serif text-base tracking-wider flex items-center justify-center border border-gold/40 group-hover:bg-terracotta transition-colors duration-300">
          RHJ
        </span>
        <span class="font-serif text-2xl sm:text-[28px] font-semibold tracking-[0.06em] text-espresso block leading-none group-hover:text-terracotta transition-colors">
          RICK H. JONES
        </span>
      </button>

      <!-- Public Navigation -->
      <nav class="flex items-center gap-6 sm:gap-10">
        <button id="nav-about" onclick="navigateTo('about')" class="nav-underline text-xs sm:text-sm uppercase tracking-[0.18em] font-medium transition-colors py-1">
          About
        </button>
        <button id="nav-gallery" onclick="navigateTo('gallery')" class="nav-underline text-xs sm:text-sm uppercase tracking-[0.18em] font-medium transition-colors py-1">
          Gallery
        </button>
        <button id="nav-contact" onclick="navigateTo('contact')" class="nav-underline text-xs sm:text-sm uppercase tracking-[0.18em] font-medium transition-colors py-1">
          Contact
        </button>
      </nav>
    </div>
  </header>

  <!-- Main Dynamic Content Container -->
  <main id="app-root" class="flex-grow w-full"></main>

  <!-- Footer -->
  <footer class="bg-sageLight text-espresso/80 border-t border-charcoal mt-auto">
    <div class="max-w-7xl mx-auto px-5 sm:px-10 py-12 flex flex-col md:flex-row items-start md:items-center justify-between gap-6">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full bg-terracotta"></span>
        <span class="font-serif text-2xl tracking-[0.06em] text-espresso">RICK H. JONES</span>
      </div>

      <div class="flex flex-wrap items-center gap-6 sm:gap-8 text-xs uppercase tracking-[0.18em]">
        <button onclick="navigateTo('about')" class="text-espresso/75 hover:text-gold transition-colors">About</button>
        <button onclick="navigateTo('gallery')" class="text-espresso/75 hover:text-gold transition-colors">Gallery</button>
        <button onclick="navigateTo('contact')" class="text-espresso/75 hover:text-gold transition-colors">Contact</button>
      </div>
    </div>
    <div class="border-t border-sand/30 py-5 px-5 sm:px-10">
      <div class="max-w-7xl mx-auto text-xs text-espresso/55">
        <span>&copy; 2026 Rick H. Jones. All artworks &amp; rights reserved.</span>
      </div>
    </div>
  </footer>

  <script>
    // =========================================================================
    // 1. CONTACT DETAILS — EDIT YOUR PHONE & EMAIL HERE
    // =========================================================================
    const CONTACT_INFO = {
      phoneDisplay: '(555) 234-8910',
      phoneRaw: '+15552348910',
      email: 'rick@rickhjones.example.com'
    };

    // =========================================================================
    // 2. ARTIST PORTRAIT & BIO — EDIT YOUR PHOTO URL, QUOTE & BIO HERE
    // =========================================================================
    const ARTIST_PROFILE = {
      portraitUrl: '', // Paste a URL or relative path like 'images/rick-portrait.jpg'
      quote: 'Every canvas begins with light—capturing the quiet warmth that turns an ordinary landscape or room into a place of stillness.',
      bio: 'Rick H. Jones paints original oil paintings exploring natural light, quiet landscapes, and intimate still lifes, with an emphasis on warmth, atmosphere, and timeless composition.'
    };

    // =========================================================================
    // 3. ARTWORKS LIST — ADD, EDIT, OR REMOVE PAINTINGS HERE
    //    All works are Oil paintings. Digital frame trim is randomized automatically.
    //    Fields:
    //      id          : Unique short ID (e.g. 'work-1', 'work-2')
    //      title       : Painting title
    //      price       : Price string (e.g. '$1,450')
    //      dimensions  : Size string (e.g. '24 × 30 IN')
    //      framed      : true (Framed) or false (Unframed)
    //      orientation : 'Portrait' | 'Landscape' | 'Square'
    //      sold        : false (Available) or true (Sold — stays visible with Sold badge)
    //      imageUrl    : Image URL or local path (e.g. 'images/amber-ridge.jpg')
    //      story       : The story behind the painting
    // =========================================================================
    const ARTWORKS = [
      {
        id: 'work-1',
        title: 'Amber Ridge at First Light',
        price: '$1,450',
        dimensions: '24 × 30 IN',
        framed: true,
        orientation: 'Portrait',
        sold: false,
        imageUrl: '',
        story: 'Painted over several quiet mornings watching warm amber light spill across the eastern ridge. Layered glazes of burnt sienna, raw umber, and soft ivory create a luminous, tranquil atmosphere.'
      },
      {
        id: 'work-2',
        title: 'Terracotta Vessels & Wild Olive',
        price: '$1,100',
        dimensions: '18 × 24 IN',
        framed: true,
        orientation: 'Portrait',
        sold: false,
        imageUrl: '',
        story: 'An intimate studio still life celebrating tactile earth tones, weathered ceramic forms, and silvery olive branches gathered after late-afternoon rain.'
      },
      {
        id: 'work-3',
        title: 'Solitude Along the Low Tide',
        price: '$2,200',
        dimensions: '36 × 48 IN',
        framed: false,
        orientation: 'Landscape',
        sold: true,
        imageUrl: '',
        story: 'A sweeping coastal horizon balancing muted sage waters against warm sandbars and soft dusk reflections. Designed as a grounding centerpiece for a living space.'
      },
      {
        id: 'work-4',
        title: 'Orchard Path in Late October',
        price: '$980',
        dimensions: '16 × 20 IN',
        framed: true,
        orientation: 'Portrait',
        sold: false,
        imageUrl: '',
        story: 'Rich ochre leaves and long afternoon shadows trace a quiet footpath through an old orchard. Expressive brushwork adds warmth and movement.'
      },
      {
        id: 'work-5',
        title: 'Evening Hearth & Linen',
        price: '$1,350',
        dimensions: '24 × 24 IN',
        framed: false,
        orientation: 'Square',
        sold: false,
        imageUrl: '',
        story: 'Exploring the quiet beauty of domestic warmth—soft candlelight dancing across folded linen and aged timber.'
      },
      {
        id: 'work-6',
        title: 'High Desert Dusk',
        price: '$1,750',
        dimensions: '30 × 40 IN',
        framed: true,
        orientation: 'Landscape',
        sold: false,
        imageUrl: '',
        story: 'Inspired by twilight skies over open canyon country, blending deep espresso shadows with glowing terracotta and antique gold horizons.'
      }
    ];

    // =========================================================================
    // DIGITAL FRAME STYLES (RANDOMIZED PER PAINTING ON LOAD)
    // =========================================================================
    const FRAME_KEYS = ['oak', 'espresso', 'gold', 'sage'];
    const FRAME_STYLES = {
      oak: {
        outerBorder: 'border-[#C8A47A]',
        matBg: 'bg-[#FCFAE3]'
      },
      espresso: {
        outerBorder: 'border-[#3F403A]',
        matBg: 'bg-[#FCFAE3]'
      },
      gold: {
        outerBorder: 'border-[#C8A47A]',
        matBg: 'bg-[#FCFAE3]'
      },
      sage: {
        outerBorder: 'border-[#879276]',
        matBg: 'bg-[#E9ECCD]'
      }
    };

    const paintings = ARTWORKS.map((work) => ({
      ...work,
      randomFrame: FRAME_KEYS[Math.floor(Math.random() * FRAME_KEYS.length)]
    }));

    let state = {
      view: 'about', // Default landing page: Artist ('about')
      selectedPaintingId: null,
      inquiryPainting: null
    };

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // =========================================================================
    // ROUTING & SCROLL REVEAL
    // =========================================================================
    function navigateTo(view, opts = {}) {
      state.view = view;
      if (opts.paintingId !== undefined) {
        state.selectedPaintingId = opts.paintingId;
      }
      if (opts.inquiryPainting !== undefined) {
        state.inquiryPainting = opts.inquiryPainting;
      } else if (view !== 'contact') {
        state.inquiryPainting = null;
      }

      updateNavState();
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function updateNavState() {
      ['about', 'gallery', 'contact'].forEach((nav) => {
        const btn = document.getElementById(`nav-${nav}`);
        if (!btn) return;
        const active =
          state.view === nav || (nav === 'gallery' && state.view === 'detail');
        if (active) {
          btn.classList.add('active', 'text-terracotta');
          btn.classList.remove('text-espresso/75');
        } else {
          btn.classList.remove('active', 'text-terracotta');
          btn.classList.add('text-espresso/75', 'hover:text-terracotta');
        }
      });
    }

    function initScrollReveal() {
      const items = document.querySelectorAll('.reveal-item');
      if (!('IntersectionObserver' in window)) {
        items.forEach((el) => el.classList.add('is-visible'));
        return;
      }
      const observer = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add('is-visible');
              observer.unobserve(entry.target);
            }
          });
        },
        { threshold: 0.08, rootMargin: '0px 0px -30px 0px' }
      );
      items.forEach((el) => observer.observe(el));
    }

    // =========================================================================
    // DIGITAL FRAMED ARTWORK COMPONENT
    // =========================================================================
    function getAspectClass(orientation) {
      const norm = (orientation || 'Portrait').toLowerCase();
      if (norm === 'landscape') return 'aspect-[4/3]';
      if (norm === 'square') return 'aspect-square';
      return 'aspect-[4/5]';
    }

    function renderFramedArtwork(painting, mode = 'grid') {
      const frame = FRAME_STYLES[painting.randomFrame] || FRAME_STYLES.oak;
      const hasImage = painting.imageUrl && painting.imageUrl.trim() !== '';
      const aspectClass = getAspectClass(painting.orientation);

      const outerPad = mode === 'detail' ? 'p-3 sm:p-4' : 'p-2.5 sm:p-3';
      const innerPad = mode === 'detail' ? 'p-4 sm:p-6' : 'p-3 sm:p-4';

      return `
        <div class="relative ${outerPad} bg-espresso/5 border-[6px] sm:border-[8px] ${frame.outerBorder} shadow-frame transition-all duration-500 ${mode === 'grid' ? 'group-hover:shadow-galleryHover group-hover:-translate-y-0.5' : ''}">
          <!-- Archival Mat Board -->
          <div class="${innerPad} ${frame.matBg} border border-sand/90">
            <!-- Canvas Surface -->
            <div class="canvas-surface relative w-full ${aspectClass} overflow-hidden border border-taupe/20 flex flex-col items-center justify-center text-center">
              ${
                hasImage
                  ? `
                    <img
                      src="${escapeHtml(painting.imageUrl)}"
                      alt="${escapeHtml(painting.title)}"
                      onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
                      class="w-full h-full object-cover transition-transform duration-700 ease-out ${mode === 'grid' ? 'group-hover:scale-105' : ''}"
                    />
                    <div style="display:none;" class="absolute inset-0 flex flex-col items-center justify-center p-6">
                      ${renderNoImageFallback(painting)}
                    </div>
                  `
                  : renderNoImageFallback(painting)
              }

              ${
                painting.sold
                  ? `
                    <div class="absolute top-3 left-3 z-10 bg-espresso text-alabaster text-[10px] uppercase tracking-[0.22em] font-semibold px-3 py-1.5 shadow-md">
                      Sold
                    </div>
                  `
                  : ''
              }

              ${
                mode === 'grid'
                  ? `
                    <div class="absolute inset-0 bg-espresso/0 group-hover:bg-espresso/15 transition-colors duration-500 flex items-end justify-end p-3.5">
                      <span class="opacity-0 translate-y-2 group-hover:opacity-100 group-hover:translate-y-0 transition-all duration-300 bg-sageLight text-espresso text-[11px] uppercase tracking-[0.16em] px-3.5 py-2 shadow-md">
                        Read Story &rarr;
                      </span>
                    </div>
                  `
                  : ''
              }
            </div>
          </div>
        </div>
      `;
    }

    function renderNoImageFallback(painting) {
      return `
        <div class="px-5 py-4 flex flex-col items-center justify-center select-none">
          <div class="w-10 h-10 rounded-full border border-taupe/30 bg-alabaster/75 flex items-center justify-center text-taupe/80 mb-3 shadow-sm">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
              <rect x="3" y="3" width="18" height="18" rx="2"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <path d="M21 15l-5-5L5 21"></path>
            </svg>
          </div>
          <span class="font-serif italic text-base sm:text-lg text-espresso/85">
            ${escapeHtml(painting.title)}
          </span>
          <span class="text-[11px] uppercase tracking-[0.2em] text-taupe mt-1">
            Original Oil Painting &middot; ${escapeHtml(painting.dimensions || '24 × 30 IN')}
          </span>
          <span class="w-8 h-[1px] bg-terracotta/50 mt-2.5"></span>
        </div>
      `;
    }

    // =========================================================================
    // VIEW 1: ARTIST / ABOUT PAGE (FRONT DEFAULT PAGE)
    // =========================================================================
    function renderAboutView() {
      const hasPortrait = ARTIST_PROFILE.portraitUrl && ARTIST_PROFILE.portraitUrl.trim() !== '';

      return `
        <div class="view-enter">
          <!-- Top Multi-Toned Artist Hero -->
          <section class="bg-sageLight text-espresso border-b border-charcoal">
            <div class="max-w-7xl mx-auto px-5 sm:px-10 py-16 sm:py-24 grid grid-cols-1 lg:grid-cols-12 gap-12 items-center">
              <!-- Left: Framed Artist Portrait -->
              <div class="lg:col-span-5">
                <div class="p-3 sm:p-4 bg-linen border-[6px] border-gold/70 shadow-galleryHover max-w-md mx-auto">
                  <div class="p-4 bg-alabaster">
                    <div class="canvas-surface aspect-[4/5] border border-taupe/25 overflow-hidden flex flex-col items-center justify-center text-center">
                      ${
                        hasPortrait
                          ? `<img src="${escapeHtml(ARTIST_PROFILE.portraitUrl)}" alt="Rick H. Jones" class="w-full h-full object-cover" />`
                          : `
                            <div class="p-8 flex flex-col items-center justify-center">
                              <div class="w-14 h-14 rounded-full border border-taupe/35 bg-alabaster/85 flex items-center justify-center text-espresso mb-4 shadow-sm">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                                  <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                                </svg>
                              </div>
                              <span class="font-serif italic text-lg text-espresso/85">
                                Rick H. Jones
                              </span>
                              <span class="w-8 h-[1px] bg-terracotta mt-3"></span>
                            </div>
                          `
                      }
                    </div>
                  </div>
                </div>
              </div>

              <!-- Right: Artist Introduction -->
              <div class="lg:col-span-7 space-y-6">
                <span class="inline-block px-3.5 py-1.5 bg-terracotta text-espresso text-xs uppercase tracking-[0.22em] font-semibold">
                  About the Artist
                </span>
                <h1 class="font-serif text-4xl sm:text-6xl text-espresso font-normal leading-tight">
                  Rick H. Jones
                </h1>
                <blockquote class="font-serif italic text-2xl sm:text-3xl text-espresso/90 leading-snug border-l-2 border-terracotta pl-5">
                  &ldquo;${escapeHtml(ARTIST_PROFILE.quote)}&rdquo;
                </blockquote>
                <p class="text-espresso/80 text-base sm:text-lg leading-relaxed">
                  ${escapeHtml(ARTIST_PROFILE.bio)}
                </p>
                <div class="pt-2">
                  <button
                    onclick="navigateTo('gallery')"
                    class="px-8 py-4 bg-terracotta hover:bg-terracottaDark text-espresso text-xs uppercase tracking-[0.22em] font-semibold transition-colors cursor-pointer"
                  >
                    View the Gallery &rarr;
                  </button>
                </div>
              </div>
            </div>
          </section>

          <!-- Artistic Philosophy & Process Cards -->
          <section class="max-w-7xl mx-auto px-5 sm:px-10 py-16 sm:py-20">
          </section>
        </div>
      `;
    }

    // =========================================================================
    // VIEW 2: GALLERY PAGE
    // =========================================================================
    function renderGalleryView() {
      const worksHtml = paintings
        .map((painting, idx) => {
          const staggerClass = idx % 3 === 1 ? 'lg:mt-6' : idx % 3 === 2 ? 'lg:mt-2' : '';
          return `
            <article
              onclick="navigateTo('detail', { paintingId: '${painting.id}' })"
              class="reveal-item ${staggerClass} group cursor-pointer flex flex-col"
              style="transition-delay: ${(idx % 3) * 90}ms"
            >
              ${renderFramedArtwork(painting, 'grid')}

              <!-- Artwork Caption & Price / Sold -->
              <div class="pt-5 pb-2 flex items-start justify-between gap-4 border-b border-sand/80 group-hover:border-terracotta/50 transition-colors">
                <div>
                  <h2 class="font-serif text-xl sm:text-2xl font-medium text-espresso group-hover:text-terracotta transition-colors leading-snug">
                    ${escapeHtml(painting.title)}
                  </h2>
                  <p class="text-xs text-taupe tracking-wide mt-1">
                    Original Oil &middot; ${escapeHtml(painting.dimensions)} &middot; ${painting.framed ? 'Framed' : 'Unframed'}
                  </p>
                </div>
                ${
                  painting.sold
                    ? `<span class="shrink-0 font-sans text-xs uppercase tracking-[0.16em] font-semibold text-alabaster bg-espresso px-3 py-1.5 border border-espresso">
                        Sold
                      </span>`
                    : `<span class="shrink-0 font-sans text-sm sm:text-base font-semibold text-espresso bg-linen group-hover:bg-terracotta group-hover:text-espresso px-3 py-1 border border-sand group-hover:border-terracotta transition-colors duration-300">
                        ${escapeHtml(painting.price)}
                      </span>`
                }
              </div>
            </article>
          `;
        })
        .join('');

      return `
        <div class="view-enter">
          <!-- Gallery Header -->
          <section class="relative overflow-hidden bg-linen border-b border-sand">
            <div class="absolute -top-24 -right-24 w-96 h-96 rounded-full bg-terracotta/10 blur-3xl pointer-events-none"></div>
            <div class="absolute -bottom-28 left-10 w-80 h-80 rounded-full bg-sage/10 blur-3xl pointer-events-none"></div>

            <div class="max-w-7xl mx-auto px-5 sm:px-10 py-14 sm:py-20 relative z-10">
              <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-end">
                <div class="lg:col-span-7">
                  <h1 class="font-serif text-4xl sm:text-6xl text-espresso font-normal leading-[1.08] tracking-tight">
                    Gallery
                  </h1>
                </div>
                <div class="lg:col-span-5 lg:pb-1">
                  <p class="text-taupe text-sm sm:text-base leading-relaxed border-l-2 border-gold pl-4">
                    Original oil paintings by Rick H. Jones. Select any available work below to read its story.
                  </p>
                </div>
              </div>
            </div>
          </section>

          <!-- Curated Gallery Grid -->
          <section class="max-w-7xl mx-auto px-5 sm:px-10 py-14 sm:py-20">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-10 gap-y-14">
              ${worksHtml}
            </div>
          </section>

          <!-- Slim Bottom Inquiry Banner -->
          <section class="max-w-7xl mx-auto px-5 sm:px-10 pb-16">
            <div class="reveal-item bg-sageLight text-espresso px-6 py-5 sm:px-8 sm:py-6 border border-charcoal flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
              <p class="text-sm sm:text-base text-espresso font-medium">
                Interested in one or more paintings? All inquiries and sales are handled by the Artist.
              </p>
              <button
                onclick="navigateTo('contact')"
                class="shrink-0 px-6 py-3 bg-terracotta hover:bg-terracottaDark text-espresso text-xs uppercase tracking-[0.2em] font-semibold transition-colors cursor-pointer"
              >
                Inquire with Rick &rarr;
              </button>
            </div>
          </section>
        </div>
      `;
    }

    // =========================================================================
    // VIEW 3: INDIVIDUAL PAINTING DETAIL PAGE
    // =========================================================================
    function renderDetailView() {
      const painting =
        paintings.find((p) => p.id === state.selectedPaintingId) ||
        paintings[0];

      if (!painting) return renderGalleryView();

      return `
        <div class="view-enter">
          <!-- Sub-bar Navigation -->
          <div class="bg-linen/80 border-b border-sand">
            <div class="max-w-7xl mx-auto px-5 sm:px-10 py-4 flex items-center justify-between">
              <button
                onclick="navigateTo('gallery')"
                class="inline-flex items-center gap-2.5 text-xs uppercase tracking-[0.18em] font-semibold text-espresso hover:text-terracotta transition-colors cursor-pointer"
              >
                <span>&larr;</span>
                <span>Back to Gallery</span>
              </button>

              <span class="text-xs uppercase tracking-[0.14em] text-taupe">
                ${painting.sold ? 'Sold' : 'Available'}
              </span>
            </div>
          </div>

          <!-- Two-Column Artwork Showcase -->
          <section class="max-w-7xl mx-auto px-5 sm:px-10 py-12 sm:py-16">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-10 lg:gap-16 items-center">
              <!-- Left Column: Framed Canvas -->
              <div class="lg:col-span-7">
                <div class="gallery-wall-ambient p-6 sm:p-12 border border-sand">
                  <div class="max-w-lg mx-auto">
                    ${renderFramedArtwork(painting, 'detail')}
                  </div>
                  <div class="mt-5 flex items-center justify-between text-[11px] uppercase tracking-[0.18em] text-taupe">
                    <span>${painting.framed ? 'Framed' : 'Unframed'}</span>
                    <span>${escapeHtml(painting.dimensions)}</span>
                  </div>
                </div>
              </div>

              <!-- Right Column: Title, Details, Story & Action -->
              <div class="lg:col-span-5 flex flex-col">
                <div class="inline-flex items-center gap-2 text-xs uppercase tracking-[0.22em] text-terracotta font-semibold">
                  <span class="w-2 h-2 rounded-full bg-terracotta"></span>
                  <span>Original Oil Painting &middot; Rick H. Jones</span>
                </div>

                <h1 class="font-serif text-3xl sm:text-5xl text-espresso font-normal mt-3 leading-[1.12]">
                  ${escapeHtml(painting.title)}
                </h1>

                <!-- Technical Specs Strip -->
                <div class="mt-6 grid grid-cols-2 gap-4 py-4 border-y border-sand bg-linen/60 px-4">
                  <div>
                    <span class="block text-[10px] uppercase tracking-[0.2em] text-taupe">Medium</span>
                    <span class="text-sm font-medium text-espresso mt-0.5 block">Original Oil Painting</span>
                  </div>
                  <div>
                    <span class="block text-[10px] uppercase tracking-[0.2em] text-taupe">Dimensions</span>
                    <span class="text-sm font-medium text-espresso mt-0.5 block">${escapeHtml(painting.dimensions)}</span>
                  </div>
                  <div>
                    <span class="block text-[10px] uppercase tracking-[0.2em] text-taupe">Presentation</span>
                    <span class="text-sm font-medium text-espresso mt-0.5 block">${painting.framed ? 'Framed' : 'Unframed'}</span>
                  </div>
                  <div>
                    <span class="block text-[10px] uppercase tracking-[0.2em] text-taupe">Status</span>
                    <span class="text-sm font-medium text-espresso mt-0.5 block">${painting.sold ? 'Sold' : 'Available'}</span>
                  </div>
                </div>

                <!-- Artwork Story -->
                <div class="mt-6">
                  <h2 class="text-xs uppercase tracking-[0.2em] text-taupe font-semibold mb-2.5">
                    Story
                  </h2>
                  <p class="text-espresso/90 text-base leading-relaxed">
                    ${escapeHtml(painting.story)}
                  </p>
                </div>

                <!-- Price / Sold CTA -->
                <div class="mt-9 pt-7 border-t border-sand">
                  ${
                    painting.sold
                      ? `
                        <div class="w-full py-4 sm:py-5 px-6 bg-espresso text-alabaster flex items-center justify-between">
                          <span class="font-serif text-2xl sm:text-3xl font-semibold tracking-wide">
                            ${escapeHtml(painting.price)}
                          </span>
                          <span class="text-xs uppercase tracking-[0.22em] font-semibold bg-alabaster/15 px-4 py-2">
                            Sold
                          </span>
                        </div>
                        <p class="text-xs text-taupe mt-3">
                          This painting has found its home. Feel free to <button onclick="navigateTo('contact')" class="underline text-espresso hover:text-terracotta cursor-pointer">contact Rick</button> about similar works.
                        </p>
                      `
                      : `
                        <p class="text-xs text-taupe mb-3">
                          Interested in adding this original oil painting to your collection? Click below to reach out directly.
                        </p>
                        <button
                          onclick="inquireAboutWork('${painting.id}')"
                          class="w-full py-4 sm:py-5 px-6 bg-terracotta hover:bg-terracottaDark text-espresso shadow-gallery hover:shadow-galleryHover transition-all duration-300 flex items-center justify-between group cursor-pointer"
                        >
                          <span class="font-serif text-2xl sm:text-3xl font-semibold tracking-wide">
                            ${escapeHtml(painting.price)}
                          </span>
                          <span class="text-xs uppercase tracking-[0.2em] font-semibold bg-espresso/25 group-hover:bg-espresso/40 px-4 py-2 transition-colors">
                            Inquire About This Piece &rarr;
                          </span>
                        </button>
                      `
                  }
                </div>

                <div class="mt-6 flex flex-wrap gap-4 text-xs text-taupe">
                  <span class="inline-flex items-center gap-1.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-sage"></span> Signed by Rick H. Jones
                  </span>
                </div>
              </div>
            </div>
          </section>
        </div>
      `;
    }

    function inquireAboutWork(id) {
      const work = paintings.find((p) => p.id === id && !p.sold);
      navigateTo('contact', { inquiryPainting: work || null });
    }

    // =========================================================================
    // VIEW 4: CONTACT PAGE
    // =========================================================================
    function renderContactView() {
      const selected = state.inquiryPainting && !state.inquiryPainting.sold ? state.inquiryPainting : null;

      const defaultMsg = selected
        ? `Hello Rick, I would like to inquire about purchasing "${selected.title}" (${selected.dimensions}, ${selected.price}). Please let me know availability and next steps.`
        : '';

      return `
        <div class="view-enter">
          <!-- Opening Statement Banner -->
          <section class="bg-linen border-b border-sand">
            <div class="max-w-5xl mx-auto px-5 sm:px-10 py-14 sm:py-20 text-center">
              <span class="inline-flex items-center gap-2 px-3.5 py-1.5 bg-alabaster border border-sand text-xs uppercase tracking-[0.22em] text-terracotta font-semibold mb-5">
                <span class="w-1.5 h-1.5 rounded-full bg-terracotta"></span>
                Inquiries &amp; Acquisitions
              </span>
              <h1 class="font-serif text-3xl sm:text-5xl text-espresso font-normal leading-tight max-w-3xl mx-auto">
                If you would like to purchase any artworks please contact me.
              </h1>
              <p class="text-taupe text-base sm:text-lg mt-4 max-w-2xl mx-auto leading-relaxed">
                Reach out directly by phone, text message, or email. I respond personally to every note.
              </p>
            </div>
          </section>

          <section class="max-w-6xl mx-auto px-5 sm:px-10 py-12 sm:py-16">
            <!-- Selected Painting Highlight Banner -->
            ${
              selected
                ? `
                <div class="mb-10 bg-sageLight text-espresso p-5 sm:p-6 border-l-4 border-terracotta shadow-gallery flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                  <div class="flex items-center gap-4">
                    <div class="w-12 h-14 canvas-surface border-2 border-gold shrink-0 flex items-center justify-center text-[9px] uppercase tracking-wider text-espresso font-semibold overflow-hidden">
                      ${selected.imageUrl ? `<img src="${escapeHtml(selected.imageUrl)}" alt="" class="w-full h-full object-cover" />` : 'Oil'}
                    </div>
                    <div>
                      <span class="text-[10px] uppercase tracking-[0.22em] text-gold font-semibold block">
                        Selected Artwork for Purchase Inquiry
                      </span>
                      <p class="font-serif text-xl sm:text-2xl text-espresso mt-0.5">
                        ${escapeHtml(selected.title)}
                        <span class="ml-2 font-sans text-sm bg-terracotta text-espresso px-2.5 py-0.5 font-semibold">
                          ${escapeHtml(selected.price)}
                        </span>
                      </p>
                    </div>
                  </div>
                  <button
                    onclick="navigateTo('contact', { inquiryPainting: null })"
                    class="text-xs uppercase tracking-[0.16em] text-espresso/70 hover:text-gold underline cursor-pointer"
                  >
                    Clear Selection
                  </button>
                </div>
                `
                : ''
            }

            <!-- 3 Contact Cards: Call, Text, Email -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
              <!-- Direct Call -->
              <a
                href="tel:${escapeHtml(CONTACT_INFO.phoneRaw)}"
                class="group bg-alabaster hover:bg-linen border border-sand border-t-4 border-t-terracotta p-6 shadow-sm hover:shadow-gallery transition-all duration-300 flex flex-col justify-between"
              >
                <div>
                  <div class="w-11 h-11 bg-terracotta/10 text-terracotta flex items-center justify-center mb-4 group-hover:bg-terracotta group-hover:text-espresso transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                    </svg>
                  </div>
                  <h2 class="font-serif text-xl text-espresso">Direct Call</h2>
                  <p class="text-sm font-semibold text-terracotta mt-1">${escapeHtml(CONTACT_INFO.phoneDisplay)}</p>
                </div>
                <span class="text-[11px] uppercase tracking-[0.16em] text-taupe group-hover:text-espresso mt-5 block">
                  Tap to Call &rarr;
                </span>
              </a>

              <!-- Direct Text / SMS -->
              <a
                href="sms:${escapeHtml(CONTACT_INFO.phoneRaw)}${selected ? `?body=${encodeURIComponent(`Hi Rick, I would like to inquire about "${selected.title}" (${selected.price}).`)}` : ''}"
                class="group bg-alabaster hover:bg-sageLight/60 border border-sand border-t-4 border-t-sage p-6 shadow-sm hover:shadow-gallery transition-all duration-300 flex flex-col justify-between"
              >
                <div>
                  <div class="w-11 h-11 bg-sage/10 text-sage flex items-center justify-center mb-4 group-hover:bg-sage group-hover:text-espresso transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
                    </svg>
                  </div>
                  <h2 class="font-serif text-xl text-espresso">Text Message</h2>
                  <p class="text-sm font-semibold text-sage mt-1">${escapeHtml(CONTACT_INFO.phoneDisplay)}</p>
                </div>
                <span class="text-[11px] uppercase tracking-[0.16em] text-taupe group-hover:text-espresso mt-5 block">
                  Send SMS &rarr;
                </span>
              </a>

              <!-- Direct Email -->
              <a
                href="mailto:${escapeHtml(CONTACT_INFO.email)}?subject=${encodeURIComponent(selected ? `Artwork Inquiry: ${selected.title}` : 'Artwork Inquiry — Rick H. Jones')}&body=${encodeURIComponent(defaultMsg)}"
                class="group bg-alabaster hover:bg-goldLight/70 border border-sand border-t-4 border-t-gold p-6 shadow-sm hover:shadow-gallery transition-all duration-300 flex flex-col justify-between"
              >
                <div>
                  <div class="w-11 h-11 bg-gold/15 text-gold flex items-center justify-center mb-4 group-hover:bg-gold group-hover:text-espresso transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                    </svg>
                  </div>
                  <h2 class="font-serif text-xl text-espresso">Direct Email</h2>
                  <p class="text-xs font-semibold text-gold mt-1.5 break-all">${escapeHtml(CONTACT_INFO.email)}</p>
                </div>
                <span class="text-[11px] uppercase tracking-[0.16em] text-taupe group-hover:text-espresso mt-5 block">
                  Compose Email &rarr;
                </span>
              </a>
            </div>
          </section>
        </div>
      `;
    }

    // =========================================================================
    // MAIN RENDER
    // =========================================================================
    function render() {
      const root = document.getElementById('app-root');
      if (!root) return;

      switch (state.view) {
        case 'gallery':
          root.innerHTML = renderGalleryView();
          break;
        case 'detail':
          root.innerHTML = renderDetailView();
          break;
        case 'contact':
          root.innerHTML = renderContactView();
          break;
        case 'about':
        default:
          root.innerHTML = renderAboutView();
          break;
      }

      initScrollReveal();
    }

    window.addEventListener('DOMContentLoaded', () => {
      updateNavState();
      render();
    });
  </script>
</body>
</html>
